        .note-template-placeholder { color: #94a3b8; font-style: italic; }

        .subject-master-reviewer .reviewer-empty { color: #94a3b8; font-style: italic; }

        /* V2.5 Responsive Workspace */
        :root {
            --lex-safe-top: env(safe-area-inset-top, 0px);
            --lex-safe-right: env(safe-area-inset-right, 0px);
            --lex-safe-bottom: env(safe-area-inset-bottom, 0px);
            --lex-safe-left: env(safe-area-inset-left, 0px);
        }
        html, body { width: 100%; min-height: 100%; overscroll-behavior: none; }
        body { height: 100vh; height: 100dvh; }
        button, a, input, select, textarea, [contenteditable="true"] { -webkit-tap-highlight-color: transparent; }
        button, a { touch-action: manipulation; }
        #mobile-sidebar-backdrop, #notebook-mobile-backdrop { display: none; }
        #mobile-bottom-nav { display: none; }
        #sidebar { padding-left: var(--lex-safe-left); }
        #app-shell-header { padding-top: var(--lex-safe-top); }
        #content-area { scrollbar-gutter: stable; }
        #content-area table { border-spacing: 0; }
        #content-area .overflow-auto,
        #content-area .overflow-x-auto,
        #content-area .overflow-y-auto { -webkit-overflow-scrolling: touch; }
        .mobile-nav-label { font-size: .65rem; line-height: .8rem; }

                z-index: 110; transform: translateX(-105%);

                box-shadow: 0 24px 60px rgba(15, 23, 42, .35);
            }
            #sidebar.mobile-open { transform: translateX(0); }
            #mobile-sidebar-backdrop {
                position: fixed; inset: 0; z-index: 100;
                background: rgba(15, 23, 42, .56); backdrop-filter: blur(2px);
            }
            #mobile-sidebar-backdrop.mobile-open { display: block; }
            #app-main { width: 100%; min-width: 0; }
            #app-shell-header { min-height: 4rem; height: auto; padding-left: 1rem; padding-right: 1rem; }
            #page-title { font-size: 1.25rem; line-height: 1.6rem; max-width: min(52vw, 24rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #content-area { padding: 1.25rem; }
            #content-area > .\-m-8 { margin: -1.25rem; }
            .subject-notebook-shell { height: calc(100dvh - 4rem) !important; min-height: 0; padding-bottom: 0 !important; }
            .subject-notebook-workspace { position: relative; overflow: hidden !important; }
            #notebook-pages-list {
                position: absolute; inset: 0 auto 0 0;
                width: min(86vw, 22rem) !important; max-width: 100%; z-index: 50;
                transform: translateX(-105%); transition: transform .25s ease;
                box-shadow: 0 20px 50px rgba(15, 23, 42, .28);
            }
            #notebook-pages-list.mobile-open { transform: translateX(0); }
            #notebook-mobile-backdrop {
                position: absolute; inset: 0; z-index: 45;
                background: rgba(15, 23, 42, .48); backdrop-filter: blur(1px);
            }
            #notebook-mobile-backdrop.mobile-open { display: block; }
            #notebook-editor-area { width: 100%; min-width: 0; }
            #pomodoro-widget {
                right: calc(.75rem + var(--lex-safe-right)) !important;
                bottom: calc(.75rem + var(--lex-safe-bottom)) !important;
                max-width: calc(100vw - 1.5rem - var(--lex-safe-left) - var(--lex-safe-right));
            }
            #app-modal { align-items: flex-end; padding: 0; padding-left: var(--lex-safe-left); padding-right: var(--lex-safe-right); }
            #app-modal-card {
                width: 100%; max-width: none; max-height: calc(94dvh - var(--lex-safe-top));
                border-radius: 1rem 1rem 0 0; padding-bottom: var(--lex-safe-bottom);
            }
            #app-modal-body { overscroll-behavior: contain; }
            #app-modal input, #app-modal select, #app-modal textarea,
            #content-area input, #content-area select, #content-area textarea { font-size: 16px; }
            #app-modal button, #content-area button { min-height: 42px; }

        @media (max-width: 767px) {
            #app-shell-header { padding-left: .75rem; padding-right: .75rem; }
            #page-title { font-size: 1.1rem; max-width: 46vw; }

            #content-area { padding: 1rem; padding-bottom: calc(6rem + var(--lex-safe-bottom)); }
            #content-area > .\-m-8 { margin: -1rem; }

            #content-area .overflow-hidden:not(.subject-notebook-workspace):not(.subject-notebook-shell) { overflow: visible !important; }
            #content-area table { min-width: 680px; }
            #content-area .grid { min-width: 0; }
            #content-area .max-w-6xl, #content-area .max-w-5xl { width: 100%; }
            #content-area h3.text-xl { font-size: 1.05rem; line-height: 1.45rem; }
            #content-area .p-8 { padding: 1.25rem; }
            #content-area .p-6 { padding: 1rem; }
            #content-area .gap-6 { gap: 1rem; }
            #content-area .mb-6 { margin-bottom: 1rem; }
            #content-area .pb-24:not(.subject-notebook-shell) { padding-bottom: 1rem; }
            #mobile-bottom-nav {

                position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
                min-height: 4.25rem;
                padding: .35rem max(.35rem, var(--lex-safe-right)) calc(.35rem + var(--lex-safe-bottom)) max(.35rem, var(--lex-safe-left));

                box-shadow: 0 -10px 30px rgba(15, 23, 42, .08); backdrop-filter: blur(14px);
            }
            #mobile-bottom-nav button {
                min-width: 0; min-height: 3.35rem; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: .2rem;
                color: #64748b; border-radius: .75rem;
            }
            #mobile-bottom-nav button:active { background: #f1f5f9; }
            #mobile-bottom-nav button.mobile-active { color: #2563eb; background: #eff6ff; }
            #pomodoro-widget {
                left: calc(.75rem + var(--lex-safe-left)) !important;
                right: calc(.75rem + var(--lex-safe-right)) !important;
                bottom: calc(5rem + var(--lex-safe-bottom)) !important;
                width: auto !important;
            }
            #pomo-main-content { padding: 1rem; }
            #pomo-time { font-size: 2.5rem; }
            #login-screen { padding: 1.5rem; padding-top: calc(1.5rem + var(--lex-safe-top)); padding-bottom: calc(1.5rem + var(--lex-safe-bottom)); text-align: center; }
            #login-screen h1 { font-size: 1.6rem; }
            #app-modal-card > div:last-child { flex-wrap: wrap; }
            #app-modal-card > div:last-child button { flex: 1 1 8rem; }
            .subject-notebook-shell > div:first-child { padding: .75rem; }
            .subject-notebook-shell > div:first-child > div { width: 100%; }
            .subject-notebook-shell .subject-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
            .subject-notebook-shell .subject-tabs button { white-space: nowrap; }
            #note-content-editor { padding: 1rem !important; font-size: .95rem; }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            #content-area { padding: 1.5rem; }
            #content-area > .\-m-8 { margin: -1.5rem; }
            #app-modal { align-items: center; padding: 1rem; }
            #app-modal-card { width: min(92vw, 44rem); border-radius: .9rem; padding-bottom: 0; }
        }
        @media (min-width: 1024px) { #sidebar { transform: none !important; } }
        @media (hover: none) { .group:hover .group-hover\:opacity-100 { opacity: 1; } }
        @media print {
            #sidebar, #app-shell-header, #pomodoro-widget, #mobile-bottom-nav,
            #mobile-sidebar-backdrop, #app-modal { display: none !important; }
            body { height: auto; overflow: visible; background: white; }
            #app-main, #content-area { display: block; height: auto; overflow: visible; padding: 0; }
        }
    </style>
</head>

        const AdvocacyUtils = {
            dayNames: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
            localDateKey(date = new Date()) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },
            parseLocalDate(dateKey) {
                const [year, month, day] = String(dateKey || '').split('-').map(Number);
                return new Date(year, (month || 1) - 1, day || 1, 0, 0, 0, 0);
            },
            combineDateTime(dateKey, timeValue = '00:00') {
                const date = this.parseLocalDate(dateKey);
                const minutes = this.timeToMinutes(timeValue);
                date.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
                return date;
            },
            timeToMinutes(value = '') {
                const raw = String(value || '').trim();
                if (!raw) return 0;
                const twelveHour = raw.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
                if (twelveHour) {
                    let hour = Number(twelveHour[1]) % 12;
                    if (twelveHour[3].toUpperCase() === 'PM') hour += 12;
                    return hour * 60 + Number(twelveHour[2]);
                }
                const twentyFour = raw.match(/^(\d{1,2}):(\d{2})$/);
                if (twentyFour) return Number(twentyFour[1]) * 60 + Number(twentyFour[2]);
                return 0;
            },
            minutesToTime(totalMinutes) {
                const normalized = ((Number(totalMinutes) % 1440) + 1440) % 1440;
                return `${String(Math.floor(normalized / 60)).padStart(2, '0')}:${String(normalized % 60).padStart(2, '0')}`;
            },
            addMinutesToTime(timeValue, minutes) {
                return this.minutesToTime(this.timeToMinutes(timeValue) + Number(minutes || 0));
            },
            formatTime(timeValue = '') {
                const minutes = this.timeToMinutes(timeValue);
                const date = new Date();
                date.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
                return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            },
            occursOn(schedule, date) {
                if (!schedule || schedule.active === false) return false;
                const dateKey = this.localDateKey(date);
                const startDate = schedule.startDate || schedule.date;
                if (!startDate || dateKey < startDate) return false;
                const recurrence = schedule.recurrence || 'one_time';
                if (recurrence === 'one_time') return dateKey === startDate;
                if (recurrence === 'daily') return true;
                if (recurrence === 'selected_days' || recurrence === 'after_class') {
                    return Array.isArray(schedule.days) && schedule.days.includes(this.dayNames[date.getDay()]);
                }
                return false;
            },
            occurrenceKey(schedule, date) {
                return `${schedule.id || 'schedule'}_${this.localDateKey(date)}`;
            },
            nextOccurrence(schedule, fromDate = new Date(), daysAhead = 45) {
                const cursor = new Date(fromDate);
                cursor.setHours(0, 0, 0, 0);
                for (let i = 0; i <= daysAhead; i += 1) {
                    const date = new Date(cursor);
                    date.setDate(cursor.getDate() + i);
                    if (this.occursOn(schedule, date)) return date;
                }
                return null;
            },
            recurrenceLabel(schedule) {
                const recurrence = schedule.recurrence || 'one_time';
                if (recurrence === 'one_time') return 'One-time session';
                if (recurrence === 'daily') return 'Every day';
                if (recurrence === 'after_class') return `After class • ${(schedule.days || []).join(', ')}`;
                return `Every ${(schedule.days || []).join(', ')}`;
            },
            localFeedback(answer, mode) {
                const text = String(answer || '').trim();
                const lower = text.toLowerCase();
                const wordCount = text ? text.split(/\s+/).length : 0;
                const sentenceCount = Math.max(1, (text.match(/[.!?]+/g) || []).length);
                const hasAnswer = /^(yes|no|the|it|he|she|they|there|under|based|the action|the accused|the petitioner|the respondent)/i.test(text) || /\b(answer|liable|valid|invalid|entitled|not entitled)\b/i.test(text.slice(0, 180));
                const hasLegalBasis = /\b(article|section|rule|under|pursuant|according to|supreme court|held that|doctrine|law provides|requisites?|elements?)\b/i.test(text);
                const hasApplication = /\b(in this case|applying|because|considering|given that|the facts|here,|therefore,? the element|this shows)\b/i.test(text);
                const hasConclusion = /\b(therefore|thus|accordingly|consequently|for these reasons|in conclusion)\b/i.test(text) || /\b(should be|cannot be|may be held|is liable|is not liable)\b/i.test(text.slice(-180));
                const fillerMatches = lower.match(/\b(um|uh|like|basically|actually|you know|so so)\b/g) || [];
                const longSentencePenalty = wordCount / sentenceCount > 38 ? 1 : 0;
                const scores = {
                    answer: hasAnswer ? 4 : 2,
                    legalBasis: hasLegalBasis ? 4 : 2,
                    application: hasApplication ? 4 : 2,
                    conclusion: hasConclusion ? 4 : 2,
                    grammar: Math.max(2, 4 - longSentencePenalty),
                    clarity: wordCount >= 40 ? 4 : 3,
                    conciseness: wordCount > 500 ? 2 : (wordCount > 250 ? 3 : 4),
                    legalStyle: hasLegalBasis && hasApplication ? 4 : 3
                };
                const improvements = [];
                if (!hasAnswer) improvements.push('Begin with a direct and definite answer to the legal question.');
                if (!hasLegalBasis) improvements.push('State the controlling law, rule, article, or doctrine.');
                if (!hasApplication) improvements.push('Connect the material facts to each element of the legal rule.');
                if (!hasConclusion) improvements.push('End with a clear conclusion consistent with your analysis.');
                if (longSentencePenalty) improvements.push('Break long sentences into shorter, more precise legal propositions.');
                if (fillerMatches.length) improvements.push(`Reduce filler words detected in the transcript (${fillerMatches.length}).`);
                const overall = Math.round(Object.values(scores).reduce((a, b) => a + b, 0) / (Object.keys(scores).length * 5) * 100);
                return {
                    scores,
                    overall,
                    strengths: [hasLegalBasis ? 'You identified a legal basis.' : 'You attempted to address the issue.', hasConclusion ? 'Your answer contains a recognizable conclusion.' : 'Your response can be strengthened through a clearer conclusion.'],
                    improvements: improvements.length ? improvements : ['Continue practicing concise factual application and precise legal language.'],
                    correctedAnswer: '',
                    overallFeedback: mode === 'oral_alac' ? `Transcript contains ${wordCount} words and ${fillerMatches.length} detected filler words.` : `Your response contains ${wordCount} words.`,
                    wordCount,
                    fillerWordCount: fillerMatches.length
                };
            }
        };

                this.unsubscribeNotes = AppDB.subscribeQuery('notes', 'subjectId', '==', subjectId, snapshot => {

                    snapshot.forEach(record => this.notesData.push({ id: record.id, ...record.data() }));

                });
                this.unsubscribeDigests = AppDB.subscribe('digests', snapshot => {
                    this.digestsData = [];
                    snapshot.forEach(record => this.digestsData.push({ id: record.id, ...record.data() }));
                    if (this.activePanel === 'digests') this.showDigests();
                    else if (this.activePanel === 'overview') this.showOverview();
                });
                this.unsubscribeDoctrines = AppDB.subscribe('doctrines', snapshot => {
                    this.doctrinesData = [];
                    snapshot.forEach(record => this.doctrinesData.push({ id: record.id, ...record.data() }));

                    else if (this.activePanel === 'overview') this.showOverview();

            refreshTabStyles() {
                const notebookTab = document.getElementById('subject-tab-notebook');
                const digestTab = document.getElementById('subject-tab-digests');
                const doctrineTab = document.getElementById('subject-tab-doctrines');
                const activeClasses = ['bg-white', 'text-blue-700', 'shadow-sm'];
                const inactiveClasses = ['text-slate-500', 'hover:text-slate-800'];
                [notebookTab, digestTab, doctrineTab].forEach(tab => {
                    if (!tab) return;
                    tab.classList.remove(...activeClasses, ...inactiveClasses);
                    tab.classList.add(...inactiveClasses);
                });
                const activeTab = this.activePanel === 'digests' ? digestTab : this.activePanel === 'doctrines' ? doctrineTab : notebookTab;
                if (activeTab) {
                    activeTab.classList.remove(...inactiveClasses);
                    activeTab.classList.add(...activeClasses);
                }
            }
            recordLinkedToSubject(record) {
                if (!record) return false;
                const subjectIds = Array.isArray(record.subjectIds) ? record.subjectIds : [];
                const excluded = Array.isArray(record.unlinkedSubjectIds) ? record.unlinkedSubjectIds : [];
                if (excluded.includes(this.subjectId)) return false;
                if (subjectIds.includes(this.subjectId) || record.primarySubjectId === this.subjectId) return true;
                const currentName = String(this.subjectName || '').trim().toLowerCase();
                if (!currentName) return false;
                const legacyNames = [record.subject, record.subjectName, record.notebook]
                    .filter(Boolean)
                    .map(value => String(value).trim().toLowerCase());
                return legacyNames.includes(currentName);
            }
            linkedDigests() {
                return this.digestsData
                    .filter(record => this.recordLinkedToSubject(record))
                    .sort((a, b) => (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' }));
            }
            linkedDoctrines() {
                return this.doctrinesData
                    .filter(record => this.recordLinkedToSubject(record))
                    .sort((a, b) => (a.article || a.topic || '').localeCompare(b.article || b.topic || '', undefined, { numeric: true, sensitivity: 'base' }));
            }

                const list = document.getElementById('notebook-pages-list'); if (!list) return;

                                <div id="adv-schedule-list" class="p-4 space-y-3 max-h-[480px] overflow-y-auto"></div>

                                <div id="adv-progress-list" class="p-4 space-y-3"></div>
                            </section>

            init() {
                this.renderPracticeChooser();
                this.unsubscribeSubjects = AppDB.subscribe('subjects', snapshot => {
                    this.subjects = [];
                    snapshot.forEach(item => {
                        const subject = { id: item.id, ...item.data() };
                        if (!subject.archived && (!AppState.activeSemesterId || subject.semesterId === AppState.activeSemesterId || !subject.semesterId)) this.subjects.push(subject);
                    });
                    this.subjects.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                });
                this.unsubscribeClasses = AppDB.subscribe('schedule', snapshot => {
                    this.classes = [];
                    snapshot.forEach(item => this.classes.push({ id: item.id, ...item.data() }));
                });
                this.unsubscribeSchedules = AppDB.subscribe('advocacy_schedules', snapshot => {
                    this.schedules = [];
                    snapshot.forEach(item => this.schedules.push({ id: item.id, ...item.data() }));
                    this.schedules.sort((a, b) => `${a.startDate || ''}${a.startTime || ''}`.localeCompare(`${b.startDate || ''}${b.startTime || ''}`));
                    this.refresh();
                });
                this.unsubscribeSessions = AppDB.subscribe('advocacy_sessions', snapshot => {
                    this.sessions = [];
                    snapshot.forEach(item => this.sessions.push({ id: item.id, ...item.data() }));
                    this.sessions.sort((a, b) => Utils.timestampMillis(b.completedAt || b.created) - Utils.timestampMillis(a.completedAt || a.created));
                    this.refresh();
                });
                this.updateNotificationButton();
            }
            destroy() {
                if (this.practiceTimer) clearInterval(this.practiceTimer);
                this.practiceTimer = null;
                if (this.speechRecognition) {
                    try { this.speechRecognition.stop(); } catch (error) {}
                }
                this.speechRecognition = null;
            }
            updateNotificationButton() {
                const button = document.getElementById('adv-notification-btn');
                if (!button) return;
                const enabled = 'Notification' in window && Notification.permission === 'granted';
                button.innerHTML = enabled ? '<i class="fas fa-bell text-green-600 mr-2"></i>Reminders Enabled' : '<i class="fas fa-bell mr-2"></i>Enable Reminders';
                button.className = enabled
                    ? 'bg-green-50 border border-green-200 text-green-700 px-4 py-2 rounded-lg text-sm font-bold'
                    : 'bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold';
            }
            refresh() {
                this.renderToday();
                this.renderSchedules();
                this.renderProgress();
            }
            completedOccurrenceKeys() {
                return new Set(this.sessions.filter(session => session.status === 'completed' && session.occurrenceKey).map(session => session.occurrenceKey));
            }
            renderToday() {
                const container = document.getElementById('adv-today-list');
                if (!container) return;
                const today = new Date();
                const todayKey = AdvocacyUtils.localDateKey(today);
                const completed = this.completedOccurrenceKeys();
                const due = this.schedules.filter(schedule => AdvocacyUtils.occursOn(schedule, today));
                document.getElementById('adv-stat-today').innerText = String(due.filter(schedule => !completed.has(AdvocacyUtils.occurrenceKey(schedule, today))).length);
                if (!due.length) {
                    container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fas fa-mug-hot text-4xl opacity-30 mb-3"></i><p class="font-medium">No advocacy session is scheduled today.</p><button onclick="window.appHandlers.quickAdvocacyPractice()" class="mt-3 text-indigo-600 font-bold hover:underline">Start a quick practice instead</button></div>`;
                    return;
                }
                container.innerHTML = due.map(schedule => {
                    const occurrenceKey = AdvocacyUtils.occurrenceKey(schedule, today);
                    const isComplete = completed.has(occurrenceKey);
                    const type = ADVOCACY_PRACTICE_TYPES[schedule.practiceType] || ADVOCACY_PRACTICE_TYPES.guided_alac;
                    return `<div class="border ${isComplete ? 'border-green-200 bg-green-50' : 'border-slate-200 bg-white'} rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div class="flex items-start gap-3"><div class="w-10 h-10 rounded-lg ${isComplete ? 'bg-green-100 text-green-700' : 'bg-indigo-100 text-indigo-700'} flex items-center justify-center"><i class="fas ${isComplete ? 'fa-check' : type.icon}"></i></div><div><p class="font-bold text-slate-800">${Security.escapeHTML(schedule.title || type.label)}</p><p class="text-xs text-slate-500 mt-1">${Security.escapeHTML(schedule.subjectName || 'General')} • ${AdvocacyUtils.formatTime(schedule.startTime)} • ${Number(schedule.durationMinutes || 20)} minutes</p><p class="text-xs text-slate-400 mt-1">${Security.escapeHTML(schedule.topic || type.label)}</p></div></div>
                        <div class="flex gap-2">${isComplete ? '<span class="text-xs font-bold text-green-700 bg-white border border-green-200 px-3 py-2 rounded-lg">Completed</span>' : `<button onclick="window.appHandlers.startScheduledAdvocacy('${schedule.id}', '${todayKey}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold"><i class="fas fa-play mr-1"></i>Start</button><button onclick="window.appHandlers.markAdvocacyMissed('${schedule.id}', '${todayKey}')" class="bg-white border border-slate-200 text-slate-500 hover:text-red-600 px-3 py-2 rounded-lg text-sm" title="Mark missed"><i class="fas fa-xmark"></i></button>`}</div>
                    </div>`;
                }).join('');
            }
            renderSchedules() {
                const container = document.getElementById('adv-schedule-list');
                if (!container) return;
                if (!this.schedules.length) {
                    container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No practice schedule yet.</div>`;
                    return;
                }
                container.innerHTML = this.schedules.map(schedule => {
                    const type = ADVOCACY_PRACTICE_TYPES[schedule.practiceType] || ADVOCACY_PRACTICE_TYPES.guided_alac;
                    const next = AdvocacyUtils.nextOccurrence(schedule);
                    return `<div class="border border-slate-200 rounded-xl p-4 ${schedule.active === false ? 'opacity-50 bg-slate-50' : 'bg-white'}">
                        <div class="flex justify-between items-start gap-3"><div><p class="font-bold text-sm text-slate-800"><i class="fas ${type.icon} text-indigo-600 mr-2"></i>${Security.escapeHTML(schedule.title || type.label)}</p><p class="text-xs text-slate-500 mt-2">${Security.escapeHTML(AdvocacyUtils.recurrenceLabel(schedule))}</p><p class="text-xs text-slate-500 mt-1">${AdvocacyUtils.formatTime(schedule.startTime)} • ${Number(schedule.durationMinutes || 20)} min</p>${next ? `<p class="text-[11px] text-indigo-600 font-bold mt-2">Next: ${next.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' })}</p>` : ''}</div><div class="flex gap-1"><button onclick="window.appHandlers.toggleAdvocacySchedule('${schedule.id}', ${schedule.active === false ? 'true' : 'false'})" class="text-slate-400 hover:text-green-600 p-1.5" title="${schedule.active === false ? 'Activate' : 'Pause'}"><i class="fas ${schedule.active === false ? 'fa-play' : 'fa-pause'}"></i></button><button onclick="window.appHandlers.editAdvocacySchedule('${schedule.id}')" class="text-slate-400 hover:text-amber-600 p-1.5"><i class="fas fa-pen"></i></button><button onclick="window.appHandlers.deleteAdvocacySchedule('${schedule.id}')" class="text-slate-400 hover:text-red-600 p-1.5"><i class="fas fa-trash"></i></button></div></div>
                    </div>`;
                }).join('');

            renderProgress() {
                const progress = document.getElementById('adv-progress-list');
                if (!progress) return;
                const completed = this.sessions.filter(session => session.status === 'completed');
                const now = new Date();
                const weekStart = new Date(now);
                weekStart.setDate(now.getDate() - 6);
                weekStart.setHours(0, 0, 0, 0);
                const completedThisWeek = completed.filter(session => {
                    const millis = Utils.timestampMillis(session.completedAt || session.created);
                    return millis >= weekStart.getTime();
                });
                document.getElementById('adv-stat-week').innerText = String(completedThisWeek.length);
                const scored = completed.filter(session => Number.isFinite(Number(session.overallScore)));
                document.getElementById('adv-stat-score').innerText = scored.length ? `${Math.round(scored.reduce((sum, session) => sum + Number(session.overallScore), 0) / scored.length)}%` : '—';
                const completionDates = new Set(completed.map(session => session.completedDate || (Utils.timestampMillis(session.completedAt) ? AdvocacyUtils.localDateKey(new Date(Utils.timestampMillis(session.completedAt))) : '')).filter(Boolean));
                let streak = 0;
                const cursor = new Date();
                cursor.setHours(0, 0, 0, 0);
                while (completionDates.has(AdvocacyUtils.localDateKey(cursor))) {
                    streak += 1;
                    cursor.setDate(cursor.getDate() - 1);
                }
                document.getElementById('adv-stat-streak').innerHTML = `${streak} <span class="text-sm text-slate-400">days</span>`;
                if (!completed.length) {
                    progress.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">Your completed sessions and scores will appear here.</div>`;
                    return;
                }
                progress.innerHTML = completed.slice(0, 5).map(session => `<div class="border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex justify-between gap-3"><div><p class="font-bold text-sm text-slate-700">${Security.escapeHTML(session.title || ADVOCACY_PRACTICE_TYPES[session.practiceType]?.label || 'Practice')}</p><p class="text-xs text-slate-400 mt-1">${Security.escapeHTML(session.subjectName || 'General')} • ${Security.escapeHTML(session.completedDate || '')}</p></div><span class="font-bold text-sm ${Number(session.overallScore || 0) >= 75 ? 'text-green-600' : 'text-amber-600'}">${Number.isFinite(Number(session.overallScore)) ? `${session.overallScore}%` : 'Done'}</span></div></div>`).join('');
            }
            renderPracticeChooser() {
                const container = document.getElementById('adv-practice-workspace');
                if (!container) return;
                container.innerHTML = `<div class="h-full flex flex-col justify-center"><div class="text-center mb-8"><i class="fas fa-comments text-6xl text-indigo-100 mb-4"></i><h4 class="text-xl font-bold text-slate-800">Choose a Practice Mode</h4><p class="text-sm text-slate-500 mt-2">You can begin immediately or use a scheduled session above.</p></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-3xl mx-auto w-full">${Object.entries(ADVOCACY_PRACTICE_TYPES).map(([id, type]) => `<button onclick="window.appHandlers.openAdvocacyPractice('${id}')" class="text-left border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 rounded-xl p-5 transition"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center"><i class="fas ${type.icon} text-xl"></i></div><div><p class="font-bold text-slate-800">${type.label}</p><p class="text-xs text-slate-500 mt-1">${id === 'guided_alac' ? 'Build your answer one ALAC section at a time.' : id === 'free_alac' ? 'Write one continuous legal answer for analysis.' : id === 'oral_alac' ? 'Practice spoken English and oral legal reasoning.' : 'Read a legal passage aloud and compare your transcript.'}</p></div></div></button>`).join('')}</div></div>`;
            }
            openPractice(config = {}) {
                const type = ADVOCACY_PRACTICE_TYPES[config.practiceType] || ADVOCACY_PRACTICE_TYPES.guided_alac;
                this.activePractice = {
                    practiceType: config.practiceType || 'guided_alac',
                    title: config.title || type.label,
                    subjectId: config.subjectId || '',
                    subjectName: config.subjectName || '',
                    topic: config.topic || '',
                    question: config.question || '',
                    durationMinutes: Number(config.durationMinutes || 10),
                    scheduleId: config.scheduleId || '',
                    occurrenceDate: config.occurrenceDate || AdvocacyUtils.localDateKey(),
                    occurrenceKey: config.occurrenceKey || '',
                    difficulty: config.difficulty || 'Intermediate',
                    startedAtMillis: Date.now()
                };
                this.renderPracticeWorkspace();
                this.startPracticeTimer(this.activePractice.durationMinutes);
            }
            renderPracticeWorkspace() {
                const container = document.getElementById('adv-practice-workspace');
                if (!container || !this.activePractice) return;
                const practice = this.activePractice;
                const type = ADVOCACY_PRACTICE_TYPES[practice.practiceType];
                const subjectOptions = [`<option value="">General Legal Practice</option>`, ...this.subjects.map(subject => `<option value="${subject.id}" ${practice.subjectId === subject.id ? 'selected' : ''}>${Security.escapeHTML(subject.name)}</option>`)].join('');
                let answerArea = '';
                if (practice.practiceType === 'guided_alac') {
                    answerArea = `<div class="grid grid-cols-1 gap-4"><div><label class="block text-xs font-bold text-blue-700 uppercase tracking-wider mb-1">A — Direct Answer</label><textarea id="adv-answer" rows="3" class="w-full p-3 border border-blue-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Answer the legal question immediately and definitively."></textarea></div><div><label class="block text-xs font-bold text-amber-700 uppercase tracking-wider mb-1">L — Legal Basis</label><textarea id="adv-legal-basis" rows="4" class="w-full p-3 border border-amber-200 rounded-lg outline-none focus:ring-2 focus:ring-amber-500" placeholder="State the controlling law, article, rule, elements, or doctrine."></textarea></div><div><label class="block text-xs font-bold text-green-700 uppercase tracking-wider mb-1">A — Application</label><textarea id="adv-application" rows="5" class="w-full p-3 border border-green-200 rounded-lg outline-none focus:ring-2 focus:ring-green-500" placeholder="Connect each material fact to the applicable rule or element."></textarea></div><div><label class="block text-xs font-bold text-purple-700 uppercase tracking-wider mb-1">C — Conclusion</label><textarea id="adv-conclusion" rows="3" class="w-full p-3 border border-purple-200 rounded-lg outline-none focus:ring-2 focus:ring-purple-500" placeholder="State the final legal result consistently with your application."></textarea></div></div>`;
                } else if (practice.practiceType === 'read_aloud') {
                    answerArea = `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4"><p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Reading Passage</p><p id="adv-reading-passage" class="serif-text leading-relaxed text-slate-800">${Security.escapeHTML(practice.question || 'The rule of law requires legal arguments to be stated clearly, supported by authority, and applied faithfully to the material facts.')}</p></div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Speech Transcript</label><textarea id="adv-transcript" rows="8" class="w-full p-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Your speech transcript will appear here. You may also type corrections."></textarea>`;
                } else if (practice.practiceType === 'oral_alac') {
                    answerArea = `<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Oral Answer Transcript</label><textarea id="adv-transcript" rows="12" class="w-full p-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Click Start Microphone and answer orally using ALAC."></textarea>`;
                } else {

                const svgData = new XMLSerializer().serializeToString(svgEl);
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `IssueTree_${topic.replace(/[^a-zA-Z0-9]/g, '_')}.svg`;

      generateCodalBooster: async () => {
                const subject = document.getElementById('booster-subject').value;
                const topic = document.getElementById('booster-topic').value.trim();
                const output = document.getElementById('booster-output');
                const btn = document.getElementById('btn-booster-gen');
                
                // Try getting key from the specific input first, then local storage
                let apiKey = document.getElementById('search-api-key') ? document.getElementById('search-api-key').value : localStorage.getItem('gemini_api_key');
                
                // Fallback: Check if there is a hidden input in the booster view itself
                if (!apiKey && document.getElementById('booster-api-key')) {
                    apiKey = document.getElementById('booster-api-key').value;
                }

                if (!apiKey) { alert("Please enter your Gemini API Key in the AI Search tab first."); return; }
                
                if (!topic) { alert("Please enter a topic or article range."); return; }
                
                btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Generating...';
                output.innerHTML = `<div class="flex flex-col justify-center h-40 items-center text-slate-400"><div class="loader mb-3"></div><p class="text-xs">Drafting provisions...</p></div>`;
                
                try {
                    const promptText = `You are a Philippine Law Codal Reference. 
                    User Request: Generate flashcards for subject '${subject}', topic: '${topic}'.
                    
                    CRITICAL INSTRUCTION: 
                    If the user asks for a specific range (e.g. "Bill of Rights" or "Arts 1-20"), provide ALL articles in that range up to a maximum of 15 cards.
                    If the topic is huge (e.g. "Entire ObliCon"), provide the top 15 most important/frequently asked provisions.
                    
                    Format strictly as a RAW JSON array of objects. 
                    [{
                        "article": "Art. 1156",
                        "title": "Concept of Obligation",
                        "text": "An obligation is a juridical necessity to give, to do or not to do."
                    }]
                    Do NOT use markdown. Output raw JSON only.`;

                    // SECURE URL
                    const apiUrl = ['https:/', '/generativelanguage.googleapis.com', '/v1beta/models/gemini-2.5-flash:generateContent?key=', apiKey].join('');

                    const response = await fetch(apiUrl, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: promptText }] }] }) 
                    });
                    
                    // NEW: Handle Rate Limits (429) specifically
                    if (response.status === 429) {
                        throw new Error("You're going too fast! The AI needs a break. Please wait 1 minute before trying again.");
                    }

                    if (!response.ok) throw new Error("API Error: " + response.statusText);
                    
                    const data = await response.json(); 
                    
                    if (!data.candidates || !data.candidates[0].content) {
                        throw new Error("The AI returned an empty response. Try a different topic.");

                                <span class="text-xs text-slate-500 font-medium text-right ml-2">${c.title}</span>
                            </div>
                            <div class="p-5 flex-1 relative">
                                <div id="card-text-${i}" class="text-slate-800 leading-relaxed text-sm font-serif text-justify">${c.text}</div>
                                <div id="card-input-area-${i}" class="hidden mt-3">
                                    <textarea class="w-full p-2 border border-slate-300 rounded text-sm mb-2" rows="3" placeholder="Type what you remember..."></textarea>
                                    <button onclick="document.getElementById('card-text-${i}').classList.remove('blur-sm', 'select-none'); document.getElementById('card-input-area-${i}').classList.add('hidden');" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded font-bold">Check Answer</button>
                                </div>
                            </div>
                            <div class="p-2 bg-slate-50 border-t border-slate-100 flex justify-end">
                                <button onclick="document.getElementById('card-text-${i}').classList.add('blur-sm', 'select-none'); document.getElementById('card-input-area-${i}').classList.remove('hidden');" class="text-xs text-slate-400 hover:text-blue-600 font-bold px-2 py-1"><i class="fas fa-eye-slash mr-1"></i> Test Me</button>
                            </div>
                        </div>
                    `).join('') + `</div>`;

                } catch (e) {

                    // NEW: Show the actual error message to the user
                    output.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-xl text-center text-sm border border-red-100 flex flex-col items-center gap-2">
                        <i class="fas fa-exclamation-circle text-2xl"></i>
                        <p class="font-bold">Generation Failed</p>

                }
            },

            updateMasterRecordSubjectLink: async (collectionName, recordId, shouldLink) => {
                const subject = window.appHandlers.getCurrentSubjectContext();
                if (!subject.id) throw new Error('No subject is currently open.');
                const recordRef = doc(db, 'artifacts', appNamespace, 'users', currentUser.uid, collectionName, recordId);
                const snapshot = await getDoc(recordRef);
                if (!snapshot.exists()) throw new Error('The selected record no longer exists.');
                const data = snapshot.data();
                const subjectIds = Array.isArray(data.subjectIds) ? [...data.subjectIds] : [];
                const unlinkedSubjectIds = Array.isArray(data.unlinkedSubjectIds) ? [...data.unlinkedSubjectIds] : [];
                const semesterIds = Array.isArray(data.semesterIds) ? [...data.semesterIds] : [];
                const unique = values => [...new Set(values.filter(Boolean))];
                const payload = { updated: serverTimestamp() };
                if (shouldLink) {
                    payload.subjectIds = unique([...subjectIds, subject.id]);
                    payload.unlinkedSubjectIds = unlinkedSubjectIds.filter(id => id !== subject.id);
                    payload.semesterIds = unique([...semesterIds, subject.semesterId]);
                    if (!data.semesterId && subject.semesterId) payload.semesterId = subject.semesterId;
                    if (!data.primarySubjectId) payload.primarySubjectId = subject.id;
                    if (!data.subject && collectionName === 'digests') payload.subject = subject.name;
                    if (!data.subjectName) payload.subjectName = subject.name;
                } else {
                    payload.subjectIds = subjectIds.filter(id => id !== subject.id);
                    payload.unlinkedSubjectIds = unique([...unlinkedSubjectIds, subject.id]);
                    if (data.primarySubjectId === subject.id) payload.primarySubjectId = payload.subjectIds[0] || null;
                }
                await updateDoc(recordRef, payload);
            },

                Modal.show({

            generateMasterReviewer: (subjectId) => {
                const notebook = views.subject_notebook;
                if (!notebook || notebook.subjectId !== subjectId) { alert('Open the subject notebook before generating its reviewer.'); return; }

                const availableNotes = notebook.notesData.filter(note => (note.sectionId || 'class_notes') !== 'master_outline' && Utils.htmlToText(note.content || ''));
                const availableDigests = notebook.linkedDigests();
                const availableDoctrines = notebook.linkedDoctrines();
                const suggestedTitle = `${notebook.subjectName || 'Subject'} — Subject Master Reviewer`;

                const sectionChoices = DEFAULT_NOTE_SECTIONS.filter(section => !['dashboard', 'master_outline'].includes(section.id)).map(section => {
                    const count = notebook.notesData.filter(note => (note.sectionId || 'class_notes') === section.id && Utils.htmlToText(note.content || '')).length;
                    const checked = ['class_notes', 'codal_provisions', 'case_digests', 'doctrines', 'recitation', 'exam_review'].includes(section.id) ? 'checked' : '';
                    return `<label class="flex items-center justify-between gap-3 p-2.5 rounded-lg border border-slate-200 bg-white hover:border-blue-300"><span class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" name="review-source-section" value="${section.id}" ${checked} class="rounded border-slate-300 text-blue-600"><i class="fas ${section.icon} text-slate-400"></i>${Security.escapeHTML(section.label.replace(/^\d+ — /, ''))}</span><span class="text-xs font-bold text-slate-400">${count}</span></label>`;
                }).join('');

                Modal.show({
                    title: '<i class="fas fa-wand-magic-sparkles text-amber-500"></i> Generate Subject Master Reviewer',
                    submitText: 'Generate Reviewer',
                    submitClass: 'px-4 py-2 bg-indigo-700 text-white rounded-lg hover:bg-indigo-800 text-sm font-medium transition shadow-sm',
                    content: `<div><label class="block text-sm font-medium text-slate-700 mb-1">Reviewer Title</label><input type="text" id="reviewer-title" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" value="${Security.escapeHTML(suggestedTitle)}"></div><div class="mt-3"><label class="block text-sm font-medium text-slate-700 mb-1">Coverage Label</label><input type="text" id="reviewer-coverage" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., Entire Subject, Midterm Coverage, Articles 1156–1178" value="Entire Subject"></div><div class="mt-3"><label class="block text-sm font-medium text-slate-700 mb-2">Include Notebook Sections</label><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-56 overflow-y-auto p-1">${sectionChoices}</div></div><div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2"><label class="flex items-center justify-between gap-3 p-3 rounded-lg border border-amber-200 bg-amber-50"><span class="text-sm font-medium text-amber-900"><input type="checkbox" id="reviewer-include-digests" checked class="mr-2 rounded border-amber-300 text-amber-600">Linked Case Digests</span><span class="text-xs font-bold text-amber-700">${availableDigests.length}</span></label><label class="flex items-center justify-between gap-3 p-3 rounded-lg border border-blue-200 bg-blue-50"><span class="text-sm font-medium text-blue-900"><input type="checkbox" id="reviewer-include-doctrines" checked class="mr-2 rounded border-blue-300 text-blue-600">Linked Doctrines</span><span class="text-xs font-bold text-blue-700">${availableDoctrines.length}</span></label></div><div class="mt-3"><label class="block text-sm font-medium text-slate-700 mb-1">Compilation Detail</label><select id="reviewer-detail" class="w-full p-2 border border-slate-300 rounded-lg outline-none"><option value="concise">Concise reviewer — shorter excerpts</option><option value="full">Detailed reviewer — longer source excerpts</option></select></div><div class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-600"><i class="fas fa-circle-info mr-1 text-blue-500"></i>This compiler organizes your existing materials into one editable page. It does not create duplicate digest or doctrine records.</div>`,
                    onSubmit: async () => {
                        const title = document.getElementById('reviewer-title').value.trim() || suggestedTitle;
                        const coverage = document.getElementById('reviewer-coverage').value.trim() || 'Entire Subject';
                        const selectedSections = [...document.querySelectorAll('input[name="review-source-section"]:checked')].map(input => input.value);
                        const includeDigests = document.getElementById('reviewer-include-digests').checked;
                        const includeDoctrines = document.getElementById('reviewer-include-doctrines').checked;
                        const detail = document.getElementById('reviewer-detail').value;
                        const excerptLimit = detail === 'full' ? 5000 : 1200;

                        const selectedNotes = availableNotes.filter(note => selectedSections.includes(note.sectionId || 'class_notes'));
                        const digests = includeDigests ? availableDigests : [];
                        const doctrines = includeDoctrines ? availableDoctrines : [];
                        if (!selectedNotes.length && !digests.length && !doctrines.length) {
                            throw new Error('There are no selected materials to compile. Add notes or link digests and doctrines first.');
                        }

                        const sectionHtml = selectedSections.map(sectionId => {
                            const section = Utils.sectionById(sectionId);
                            const notes = selectedNotes.filter(note => (note.sectionId || 'class_notes') === sectionId);
                            if (!notes.length) return '';
                            const entries = notes.map(note => {
                                const sourceText = Utils.excerpt(Utils.htmlToText(note.content || ''), excerptLimit);
                                return `<div class="reviewer-source"><h3>${Security.escapeHTML(note.title || 'Untitled Page')}</h3><p>${Security.escapeHTML(sourceText).replace(/\n/g, '<br>')}</p></div>`;
                            }).join('');
                            return `<h2>${Security.escapeHTML(section.label)}</h2>${entries}`;
                        }).join('');

                        const doctrineHtml = doctrines.length ? `<h2>Important Linked Doctrines</h2>${doctrines.map(item => {
                            const heading = [item.article || item.topic || 'General Doctrine', item.caseTitle].filter(Boolean).join(' — ');
                            return `<div class="reviewer-source"><h3>${Security.escapeHTML(heading)}</h3>${item.citation ? `<p><strong>Citation:</strong> ${Security.escapeHTML(item.citation)}</p>` : ''}<p><strong>Core Doctrine:</strong> ${Security.escapeHTML(Utils.excerpt(item.doctrine || 'No doctrine recorded.', excerptLimit))}</p>${item.application ? `<p><strong>Application:</strong> ${Security.escapeHTML(Utils.excerpt(item.application, excerptLimit))}</p>` : ''}</div>`;
                        }).join('')}` : '';

                        const digestHtml = digests.length ? `<h2>Leading Linked Cases</h2>${digests.map(item => {
                            const facts = detail === 'full' && item.facts ? `<p><strong>Material Facts:</strong> ${Security.escapeHTML(Utils.excerpt(item.facts, excerptLimit))}</p>` : '';
                            return `<div class="reviewer-source"><h3>${Security.escapeHTML(item.title || 'Untitled Case')}</h3>${item.citation ? `<p><strong>Citation:</strong> ${Security.escapeHTML(item.citation)}</p>` : ''}${item.topic ? `<p><strong>Topic:</strong> ${Security.escapeHTML(item.topic)}</p>` : ''}${facts}<p><strong>Issue:</strong> ${Security.escapeHTML(Utils.excerpt(item.issue || 'No issue recorded.', excerptLimit))}</p><p><strong>Ruling:</strong> ${Security.escapeHTML(Utils.excerpt(item.ruling || 'No ruling recorded.', excerptLimit))}</p>${item.ratio ? `<p><strong>Ratio:</strong> ${Security.escapeHTML(Utils.excerpt(item.ratio, excerptLimit))}</p>` : ''}${item.doctrine ? `<p><strong>Doctrine:</strong> ${Security.escapeHTML(Utils.excerpt(item.doctrine, excerptLimit))}</p>` : ''}</div>`;
                        }).join('')}` : '';

                        const generatedDate = new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
                        const sourceCount = selectedNotes.length + digests.length + doctrines.length;
                        const content = `<div class="note-template-block subject-master-reviewer"><h1>${Security.escapeHTML(title)}</h1><div class="reviewer-meta"><p><strong>Subject:</strong> ${Security.escapeHTML(notebook.subjectName)}</p><p><strong>Semester:</strong> ${Security.escapeHTML(AppState.activeLabel())}</p><p><strong>Coverage:</strong> ${Security.escapeHTML(coverage)}</p><p><strong>Generated:</strong> ${Security.escapeHTML(generatedDate)}</p><p><strong>Compiled Sources:</strong> ${sourceCount} (${selectedNotes.length} notebook pages, ${digests.length} case digests, ${doctrines.length} doctrines)</p></div><div class="reviewer-callout"><strong>Editing reminder:</strong> This is an editable consolidated reviewer. The original notebook pages, case digests, and doctrine records remain unchanged and linked to the subject.</div><h2>I. Coverage and Source Map</h2><p>This reviewer covers <strong>${Security.escapeHTML(coverage)}</strong>. Review each compiled section, remove unnecessary material, add transitions, and rewrite the final synthesis in your own words.</p>${sectionHtml || '<p class="reviewer-empty">No notebook sections were included.</p>'}${doctrineHtml}${digestHtml}<h2>Final Exam Checklist</h2><ul><li>Know the general rules and controlling provisions.</li><li>Memorize the elements, requisites, exceptions, and qualifications.</li><li>Connect every major doctrine to its leading case.</li><li>Practice distinguishing similar concepts.</li><li>Answer hypotheticals using a clear legal analysis structure.</li></ul><h2>Personal Synthesis</h2><p class="note-template-placeholder">Rewrite the most important rules and relationships in your own words before relying on this reviewer for recitation or examinations.</p></div>`;

                        await AppDB.add('notes', { semesterId: AppState.activeSemesterId || null, subjectId, sectionId: 'master_outline', noteType: 'master_reviewer_generated', title, content, coverage, generatedSourceCount: sourceCount, generated: true, created: serverTimestamp(), updated: serverTimestamp() });
                    }
                });
            },

            openNote: (noteId, title, content, btnElement) => {
                window.appHandlers.closeNotebookPages();
                views.subject_notebook.activeNoteId = noteId;
                views.subject_notebook.activePanel = 'notes';
                views.subject_notebook.refreshTabStyles();
                document.querySelectorAll('#notebook-pages-list button').forEach(b => { b.classList.remove('bg-blue-50', 'text-blue-700', 'border-l-blue-600'); b.classList.add('text-slate-600', 'border-l-transparent'); });
                if(btnElement) { btnElement.classList.remove('text-slate-600', 'border-l-transparent'); btnElement.classList.add('bg-blue-50', 'text-blue-700', 'border-l-blue-600'); }
                
                let displayTitle = title ? title.replace(/\\'/g, "'") : 'Untitled Page';
                let displayContent = content ? content.replace(/\\n/g, '\n').replace(/\\'/g, "'").replace(/\\"/g, '"') : '';
                const safeTitleForPrint = displayTitle.replace(/'/g, "\\'");
                const area = document.getElementById('notebook-editor-area');
                
                area.innerHTML = `
                    <div class="flex-1 flex flex-col p-8 bg-white m-6 rounded-2xl shadow-sm border border-slate-200 flex-shrink-0 min-h-0 relative">
                        <div class="absolute top-6 right-8 flex items-center gap-2">
                            <span id="note-save-status" class="text-xs font-bold text-slate-400 opacity-0 transition-opacity duration-300"><i class="fas fa-cloud-upload-alt mr-1"></i> Auto-saved</span>
                        </div>
                        
                        <div class="flex justify-between items-center mb-4 mt-2 pr-28">
                            <input type="text" id="note-title-editor" class="text-3xl font-bold text-slate-800 border-none outline-none focus:ring-0 placeholder-slate-300 serif-text bg-transparent flex-1" value="${displayTitle.replace(/"/g, '&quot;')}" placeholder="Page Title...">
                            <div class="flex gap-2">
                                <button onclick="window.appHandlers.printNote('${safeTitleForPrint}')" class="text-slate-400 hover:text-blue-600 p-2" title="Print / Save PDF"><i class="fas fa-print"></i></button>
                                <button onclick="window.appHandlers.downloadText('${safeTitleForPrint}.txt', document.getElementById('note-content-editor').innerText)" class="text-slate-400 hover:text-blue-600 p-2" title="Download Text"><i class="fas fa-download"></i></button>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mb-4 pb-3 border-b border-slate-100 items-center">
                            <select onchange="window.appHandlers.formatText('fontName', this.value); this.selectedIndex=0;" class="h-8 rounded border border-slate-200 text-slate-600 text-sm focus:outline-none px-1 bg-slate-50 cursor-pointer" title="Font Style">
                                <option value="" disabled selected>Font</option>
                                <option value="Inter, sans-serif">Modern</option>
                                <option value="Merriweather, serif">Classic</option>
                                <option value="Courier New, monospace">Typewriter</option>
                            </select>
                            <select onchange="window.appHandlers.formatText('fontSize', this.value); this.selectedIndex=0;" class="h-8 rounded border border-slate-200 text-slate-600 text-sm focus:outline-none px-1 bg-slate-50 cursor-pointer" title="Font Size">
                                <option value="" disabled selected>Size</option>
                                <option value="1">Small</option>
                                <option value="3">Normal</option>
                                <option value="5">Large</option>
                                <option value="7">Huge</option>
                            </select>
                            
                            <div class="w-px h-5 bg-slate-300 mx-1"></div>
                            
                            <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded px-1 h-8" title="Text Color">
                                <i class="fas fa-font text-slate-500 text-xs pl-1"></i>
                                <input type="color" oninput="window.appHandlers.formatText('foreColor', this.value)" class="w-5 h-5 p-0 border-0 rounded cursor-pointer bg-transparent">
                            </div>
                            <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded px-1 h-8" title="Highlight Color">
                                <i class="fas fa-highlighter text-slate-500 text-xs pl-1"></i>
                                <input type="color" value="#fde68a" oninput="window.appHandlers.formatText('hiliteColor', this.value)" class="w-5 h-5 p-0 border-0 rounded cursor-pointer bg-transparent">
                            </div>

                            <div class="w-px h-5 bg-slate-300 mx-1"></div>

                            <button onclick="window.appHandlers.formatText('bold')" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-600 font-bold transition" title="Bold (Ctrl+B)"><i class="fas fa-bold"></i></button>
                            <button onclick="window.appHandlers.formatText('italic')" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-600 italic transition" title="Italic (Ctrl+I)"><i class="fas fa-italic"></i></button>
                            <button onclick="window.appHandlers.formatText('underline')" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-600 underline transition" title="Underline (Ctrl+U)"><i class="fas fa-underline"></i></button>
                            
                            <div class="w-px h-5 bg-slate-300 mx-1"></div>
                            
                            <button onclick="window.appHandlers.formatText('insertUnorderedList')" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-600 transition" title="Bullet List"><i class="fas fa-list-ul"></i></button>
                            <button onclick="window.appHandlers.formatText('insertOrderedList')" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-600 transition" title="Numbered List"><i class="fas fa-list-ol"></i></button>
                        </div>

                        <div id="note-content-editor" contenteditable="true" class="flex-1 w-full border-none outline-none overflow-y-auto text-slate-700 leading-relaxed text-base font-sans focus:ring-0 bg-transparent" style="min-height: 200px;"></div>
                        
                        <div class="mt-4 flex justify-between items-center pt-4 border-t border-slate-100">
                            <p class="text-xs text-slate-400 italic">Changes are saved automatically.</p>
                            <button onclick="window.appHandlers.saveNote('${noteId}', false)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-6 py-2 rounded-lg text-sm font-bold transition shadow-sm"><i class="fas fa-save mr-2"></i> Force Save</button>
                        </div>
                    </div>`;
                
                const editor = document.getElementById('note-content-editor');
                const titleEditor = document.getElementById('note-title-editor');
                editor.innerHTML = displayContent;

                // --- SAFE AUTO-SAVE LOGIC ---
                const doneTypingInterval = 1000;
                const triggerAutoSave = () => {
                    const existingTimer = noteAutosaveTimers.get(noteId);
                    if (existingTimer) clearTimeout(existingTimer);
                    const snapshot = {
                        title: titleEditor.value.trim() || 'Untitled Page',
                        content: editor.innerHTML
                    };
                    const status = document.getElementById('note-save-status');
                    if (status) {
                        status.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Saving...';
                        status.classList.remove('opacity-0', 'text-green-500');
                        status.classList.add('text-amber-500', 'opacity-100');
                    }
                    const timer = setTimeout(() => {
                        noteAutosaveTimers.delete(noteId);
                        window.appHandlers.saveNote(noteId, true, snapshot);
                    }, doneTypingInterval);
                    noteAutosaveTimers.set(noteId, timer);
                };

                editor.addEventListener('input', triggerAutoSave);
                titleEditor.addEventListener('input', triggerAutoSave);
            },

            saveNote: async (noteId, isAutoSave = false, capturedSnapshot = null) => { 
                const titleEl = document.getElementById('note-title-editor');
                const contentEl = document.getElementById('note-content-editor');
                const snapshot = capturedSnapshot || (titleEl && contentEl ? { title: titleEl.value.trim() || 'Untitled Page', content: contentEl.innerHTML } : null);
                if (!snapshot) return;
                const status = views.subject_notebook.activeNoteId === noteId ? document.getElementById('note-save-status') : null;
                
                try { 
                    await AppDB.update('notes', noteId, { title: snapshot.title, content: snapshot.content, updated: serverTimestamp() }); 
                    if (status) {
                        status.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Saved to Cloud';
                        status.classList.remove('text-amber-500');
                        status.classList.add('text-green-500');
                        setTimeout(() => status.classList.remove('opacity-100'), 2000); 
                    }
                } catch(e) { 
                    console.error("Save error:", e);
                    if (!isAutoSave) alert("Error saving note."); 
                } 
            },
            printNote: (title) => { 
                const contentHtml = document.getElementById('note-content-editor').innerHTML; 
                const html = `<h1>${title}</h1><br><div style="font-family: sans-serif; line-height: 1.6;">${contentHtml}</div>`;

generateReview: async () => {

        let promptText = '';
        const baseInstructions = 'DO NOT use markdown like \`\`\`json. Output ONLY a raw JSON array.';
        const truncatedText = text.substring(0, 45000); // Safety constraint

        if (mode === 'recit') {
            promptText = `You are a strict law professor helping a student memorize key concepts. Based strictly on the provided text, generate exactly 10 flashcards for recitation prep. Focus on definitions, elements, exceptions, and core doctrines. Return ONLY a raw JSON array of objects, where each object has a "front" (the question/term) and a "back" (the precise answer/definition). ${baseInstructions} Material: ${truncatedText}`;
        } else {
            promptText = `You are a rigorous Bar Examiner. Based strictly on the provided text, generate exactly 5 essay-type hypothetical legal problems. These problems must test issue spotting, critical thinking, and the direct application of the rules and jurisprudence found in the text. Return ONLY a raw JSON array of objects, where each object has: "question" (The hypothetical scenario and the specific question asked at the end) and "suggested_answer" (A brief suggested answer key highlighting the specific legal issue to spot and the rule to apply). ${baseInstructions} Material: ${truncatedText}`;
        }

        /* --- 2. API REQUEST PHASE --- */
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                contents: [{ role: "user", parts: [{ text: promptText }] }],
                generationConfig: { responseMimeType: "application/json" } // Force JSON response
            })
        });

        if (!response.ok) throw new Error(`API Error: ${response.status}`);

        /* --- 3. JSON PARSING & DATA PREP --- */
        const data = await response.json();
        const jsonString = cleanAiJsonResponse(data.candidates[0].content.parts[0].text);
        let parsedData = JSON.parse(jsonString);

        // Enhance flashcard data with SRS (Space Repetition System) parameters
        if (mode === 'recit') {
            parsedData = parsedData.map(c => ({...c, nextReview: Date.now(), interval: 0}));

                // UX Improvement: Cleaner classes and structured content
                el.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-300 cursor-pointer hover:shadow-md transition flex flex-col justify-between min-h-[160px] group relative overflow-hidden";
                el.onclick = function() { handleCardFlip(this); };

                // Question Front
                const frontHtml = `
                    <div class="card-inner flex flex-col h-full justify-between">

                // Answer Back
                const backHtml = `
                    <div class="card-back hidden animate-fade-in flex flex-col h-full justify-between">

        } else {
            /* --- Mode 2: Essay (Mock Bar Exam) --- */
            output.innerHTML += `
                <h3 class="font-bold text-xl mb-4 py-2 flex items-center gap-2">
                    <i class="fas fa-balance-scale text-slate-800"></i> Mock Bar Examination

            let html = `
                <div class="text-center border-b-2 border-black pb-4 mb-8">

                        <details class="mt-5 font-sans text-sm group border-t border-slate-100 pt-4">
                            <summary class="cursor-pointer text-amber-600 font-bold flex items-center gap-2 hover:text-amber-700 outline-none list-none">
                                <i class="fas fa-lightbulb transition-transform group-open:text-green-500"></i> Show Suggested Answer
                            </summary>
                            <div class="mt-3 p-5 bg-amber-50 border border-amber-200 rounded-xl text-slate-800 leading-relaxed shadow-inner whitespace-pre-wrap">${item.suggested_answer}</div>
                        </details>
                    </div>
                    ${i !== parsedData.length - 1 ? '<hr class="my-8 border-slate-200">' : ''}`;
            });
            paper.innerHTML = html;
            output.appendChild(paper);
        }

    } catch (error) {
        console.error("Gemini failed:", error);
        showReviewErrorState(output, error.message);
    } finally {
        /* --- Post-Request Cleanup Phase --- */
        btn.disabled = false;
        btn.innerHTML = 'Generate AI Review';
        
        // Crucial Cleanup: Clear the uploaded PDF text so it doesn't automatically 
        // generate a review the next time the button is clicked!
        window.appHandlers.pdfText = '';
    }
